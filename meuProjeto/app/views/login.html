<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - CineApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container-auth">
        <h1 style="text-align: center; color: #e50914;">CineApp</h1>
        <p style="text-align: center; color: #94a3b8; margin-bottom: 2rem;">Acede à tua conta</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert-{{ category if category in ['success', 'error'] else 'error' }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('filme.login') }}" method="POST">
            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="teu.email@exemplo.com">
            </div>
            <div>
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit">Entrar</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: #94a3b8;">
            Ainda não tem conta? <a href="{{ url_for('filme.register') }}">Cadastre-se</a>
        </p>
    </div>
</body>
</html>
