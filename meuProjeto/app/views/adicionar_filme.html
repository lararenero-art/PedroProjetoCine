<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Filme - CineApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container-auth">
        <h1 style="text-align: center; color: #e50914;">Cadastrar Filme</h1>
        
        <form action="{{ url_for('filme.adicionar_filme') }}" method="POST">
            <div>
                <label for="title">Título do Filme</label>
                <input type="text" id="title" name="title" required placeholder="Ex: Interstellar">
            </div>
            <div>
                <label for="release_year">Ano de Lançamento</label>
                <input type="number" id="release_year" name="release_year" required placeholder="Ex: 2014" style="width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white;">
            </div>
            <div>
                <label for="poster_url">URL do Poster/Capa (Link da Imagem)</label>
                <input type="text" id="poster_url" name="poster_url" placeholder="https://exemplo.com/poster.jpg">
            </div>
            <div>
                <label for="synopsis">Sinopse</label>
                <textarea id="synopsis" name="synopsis" rows="4" style="width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white;" placeholder="Breve resumo do filme..."></textarea>
            </div>
            <button type="submit">Salvar Filme</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;"><a href="{{ url_for('filme.listar_filmes') }}">Voltar ao Catálogo</a></p>
    </div>
</body>
</html>
